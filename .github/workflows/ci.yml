name: verify

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install
      - run: make test
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
      - name: Resource budgets (loopback fixture)
        run: SSHWB_BENCH=1 go test -run TestResource -count=1 -timeout 20m -v ./tests/resource/

  native-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/sshworkbench
        env:
          CGO_ENABLED: '0'
